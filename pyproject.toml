[project]
name = "assessorai-dados"
version = "0.1.0"
description = "Corpus, API and MCP for public Brazilian legislative data"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "mcp>=2,<3",
  "openai>=1.100,<2",
  "orjson>=3.10,<4",
  "pgvector>=0.4,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "pyarrow>=21,<22",
  "python-dateutil>=2.9,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.35,<1",
  "zstandard>=0.23,<1",
]

[project.optional-dependencies]
dev = [
  "duckdb>=1.3,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[project.scripts]
assessorai-data = "assessorai_dados.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assessorai_dados"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
